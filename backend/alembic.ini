# Postgres schema migrations. The database URL comes from DATABASE_URL (app settings).
#   cd backend && DATABASE_URL=postgresql://... .venv/bin/alembic upgrade head
#   cd backend && DATABASE_URL=postgresql://... .venv/bin/alembic revision --autogenerate -m "..."
# The app also runs `upgrade head` automatically on startup when using Postgres.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
